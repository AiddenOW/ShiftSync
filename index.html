                            </div>
                        )}

                        {/* --- MODIFICATION ICI : CHAT EN PLEIN ÉCRAN --- */}
                        {activeTab === 'chat' && (
                            <div className="flex flex-col space-y-5 p-2 pt-4">
                                {chatMessages.map(m => (
                                    <div key={m.id} 
                                         className={`flex flex-col ${m.sender === employee ? 'items-end' : 'items-start'} animate-in slide-in-from-bottom-2 duration-300`}
                                         onTouchStart={(e) => startPress(m, e)}
                                         onTouchMove={movePress}
                                         onTouchEnd={stopPress}
                                         onMouseDown={(e) => startPress(m, e)}
                                         onMouseMove={movePress}
                                         onMouseUp={stopPress}
                                         onMouseLeave={stopPress}
                                    >
                                        <span className="text-[9px] font-black opacity-40 px-3 uppercase tracking-widest mb-1">{m.sender}</span>
                                        <div className={`max-w-[85%] rounded-[1.75rem] px-5 py-3.5 shadow-lg border border-white/20 transition-all ${m.sender === employee ? 'bg-gradient-to-br from-purple-600 to-indigo-600 text-white rounded-br-sm' : 'glass-strong rounded-bl-sm font-semibold text-slate-800 dark:text-white'}`}>
                                            <p className="leading-relaxed">
                                                {renderMessageText(m.text)}
                                                {m.edited && <span className="text-[9px] opacity-40 ml-2 italic font-black">modifié</span>}
                                            </p>
                                        </div>
                                        {/* HORODATAGE DISCRET */}
                                        <span className="text-[9px] font-bold opacity-30 px-3 mt-1 tracking-wider">
                                            {formatMessageTime(m.timestamp)}
                                        </span>
                                    </div>
                                ))}
                                {/* Espace vide pour ne pas que le dernier message soit caché par la barre de saisie */}
                                <div ref={messagesEndRef} className="h-10 shrink-0" />
                            </div>
                        )}
                    </main>

                    {/* Champ de saisie du chat, fixé en bas juste au dessus du menu */}
                    {activeTab === 'chat' && (
                        <div className="fixed bottom-[110px] left-0 right-0 px-4 z-40 flex justify-center pointer-events-none">
                            <div className="w-full max-w-md pointer-events-auto">
                                {isEditingMessage && (
                                    <div className="bg-purple-600/10 dark:bg-purple-400/10 backdrop-blur rounded-t-2xl px-5 py-2 text-[10px] font-black text-purple-700 dark:text-purple-300 flex justify-between items-center animate-in slide-in-from-bottom-2">
                                        <span>Modification du message</span>
                                        <button onClick={() => { setIsEditingMessage(null); setNewChatMessage(''); }} className="uppercase tracking-widest">Annuler</button>
                                    </div>
                                )}
                                {/* Suggestions @mention */}
                                {mentionSuggestions.length > 0 && (
                                    <div className="glass-strong rounded-2xl mb-2 overflow-hidden shadow-xl border border-white/30 animate-in slide-in-from-bottom-2">
                                        {mentionSuggestions.map(name => (
                                            <button key={name} onClick={() => insertMention(name)}
                                                className="w-full text-left px-4 py-3 font-black hover:bg-purple-50 dark:hover:bg-purple-900/20 flex items-center gap-3 transition-colors active:bg-purple-100 border-b border-white/10 last:border-0">
                                                <span className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-100 to-indigo-100 dark:from-purple-900/40 dark:to-indigo-900/40 text-purple-700 dark:text-purple-300 flex items-center justify-center font-black text-sm flex-shrink-0">{name.charAt(0)}</span>
                                                <span className="text-purple-700 dark:text-purple-300">@{name}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}
                                <form onSubmit={handleSendChat} className={`glass-strong ${isEditingMessage ? 'rounded-b-[2.5rem]' : 'rounded-[2.5rem]'} p-2.5 flex items-center gap-3 shadow-[0_15px_40px_rgba(0,0,0,0.15)] border border-white/40`}>
                                    <input ref={chatInputRef} type="text" value={newChatMessage} onChange={handleChatInput} placeholder="Écrire… (@mention)" className="flex-1 bg-transparent px-5 py-3 font-bold text-slate-900 dark:text-white focus:outline-none placeholder:opacity-40" />
                                    <button type="submit" disabled={!newChatMessage.trim()} className={`p-4 ${isEditingMessage ? 'bg-orange-500' : 'bg-gradient-to-br from-purple-600 to-indigo-600'} text-white rounded-full shadow-lg active:scale-90 transition-transform disabled:opacity-30 disabled:grayscale`}>
                                        {isEditingMessage ? <IconEdit /> : <IconSend />}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 glass-strong pt-4 pb-4 px-6 flex justify-between shadow-[0_-15px_40px_rgba(0,0,0,0.1)] z-50 border-t border-white/30">
                        <div className="max-w-md mx-auto w-full flex justify-between gap-2">
                            <button onClick={() => setActiveTab('me')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all ${activeTab === 'me' ? 'bg-purple-600/10 text-purple-700 dark:text-purple-400 shadow-inner border border-purple-500/20' : 'opacity-40 hover:opacity-70'}`}>
                                <IconUser /><span className="text-[9px] font-black uppercase mt-1 tracking-tighter">Moi</span>
                            </button>
                            <button onClick={() => setActiveTab('team')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all ${activeTab === 'team' ? 'bg-purple-600/10 text-purple-700 dark:text-purple-400 shadow-inner border border-purple-500/20' : 'opacity-40 hover:opacity-70'}`}>
                                <IconUsers /><span className="text-[9px] font-black uppercase mt-1 tracking-tighter">Équipe</span>
                            </button>
                            <button onClick={() => setActiveTab('vacances')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all ${activeTab === 'vacances' ? 'bg-purple-600/10 text-purple-700 dark:text-purple-400 shadow-inner border border-purple-500/20' : 'opacity-40 hover:opacity-70'}`}>
                                <IconPlane /><span className="text-[9px] font-black uppercase mt-1 tracking-tighter">Congés</span>
                            </button>
                            <button onClick={() => setActiveTab('chat')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl transition-all relative ${activeTab === 'chat' ? 'bg-purple-600/10 text-purple-700 dark:text-purple-400 shadow-inner border border-purple-500/20' : 'opacity-40 hover:opacity-70'}`}>
                                <IconMessage />
                                {hasUnreadChat && (
                                    <span className="absolute top-2 right-1/4 h-3 w-3 bg-red-500 rounded-full border-2 border-white dark:border-slate-900 animate-pulse shadow-md"></span>
                                )}
                                <span className="text-[9px] font-black uppercase mt-1 tracking-tighter">Chat</span>
                            </button>
                        </div>
                    </nav>

                    {/* MENU CONTEXTUEL MESSAGE (Appui long) */}
                    {messageContextMenu && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setMessageContextMenu(null)}>
                            <div className="w-full max-w-sm glass-strong rounded-t-[2.5rem] sm:rounded-[2.5rem] p-6 animate-in slide-in-from-bottom-full duration-300" onClick={e => e.stopPropagation()}>
                                <div className="w-12 h-1.5 bg-slate-300 dark:bg-slate-600 rounded-full mx-auto mb-4 sm:hidden"></div>

                                {/* Aperçu du message */}
                                <div className="p-3 glass rounded-2xl mb-5 italic text-sm opacity-70 border border-white/20 truncate">
                                    "{messageContextMenu.text}"
                                </div>

                                {/* Options edit/delete seulement pour ses propres messages */}
                                {messageContextMenu.sender === employee && (
                                    <div className="space-y-3">
                                        <button onClick={() => startEditMessage(messageContextMenu)} className="w-full flex items-center justify-center gap-3 py-4 bg-purple-600 text-white rounded-2xl font-black shadow-lg shadow-purple-500/20 active:scale-95 transition-all">
                                            <IconEdit /> Modifier le message
                                        </button>
                                        <button onClick={() => deleteMessage(messageContextMenu.id)} className="w-full flex items-center justify-center gap-3 py-4 bg-red-500 text-white rounded-2xl font-black shadow-lg shadow-red-500/20 active:scale-95 transition-all">
                                            <IconTrash /> Supprimer définitivement
                                        </button>
                                    </div>
                                )}
                                <button onClick={() => setMessageContextMenu(null)} className="w-full py-4 glass text-slate-500 rounded-2xl font-black active:scale-95 transition-all mt-3">
                                    Fermer
                                </button>
                            </div>
                        </div>
                    )}

                    {isChangingActivePin && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-lg z-[60] flex items-center justify-center p-4">
                            <div className="glass-strong rounded-[3rem] p-10 w-full max-w-xs text-center border border-white/30 shadow-2xl">
                                <h3 className="font-black text-2xl mb-8 text-purple-700 dark:text-purple-300 tracking-tight">Modifier PIN</h3>
                                <div className="space-y-4 mb-8">
                                    <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" value={activeNewPin} onChange={e => setActiveNewPin(e.target.value)} className="w-full glass-input rounded-2xl p-5 font-black text-center text-3xl shadow-inner outline-none focus:ring-4 focus:ring-purple-500/20" placeholder="PIN" />
                                    <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" value={activeConfirmPin} onChange={e => setActiveConfirmPin(e.target.value)} className="w-full glass-input rounded-2xl p-5 font-black text-center text-3xl shadow-inner outline-none focus:ring-4 focus:ring-purple-500/20" placeholder="Confirmer" />
                                </div>
                                {activePinError && <p className="text-red-500 text-xs font-bold mb-4">{activePinError}</p>}
                                <div className="flex gap-3">
                                    <button onClick={() => setIsChangingActivePin(false)} className="flex-1 glass py-4 rounded-2xl font-black text-slate-500">Annuler</button>
                                    <button onClick={submitActivePinChange} className="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-purple-500/30">Sauver</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editModal && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-lg z-[60] flex items-center justify-center p-4">
                            <div className="glass-strong rounded-[2.5rem] p-8 w-full max-w-sm border border-white/30 shadow-2xl">
                                <h3 className="font-black text-2xl mb-6 flex items-center gap-3 tracking-tight">
                                    <div className="w-10 h-10 bg-purple-600 text-white rounded-xl flex items-center justify-center shadow-lg text-sm">🗓️</div>
                                    Modifier Horaire
                                </h3>
                                <p className="mb-6 opacity-60 text-sm font-bold ml-1 px-2 border-l-4 border-purple-500">
                                    {new Date(editModal.ds).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}
                                </p>
                                <input type="text" id="shiftIn" defaultValue={editModal.curr} className="w-full glass-input rounded-2xl p-5 font-black text-xl mb-8 shadow-inner outline-none focus:ring-4 focus:ring-purple-500/20" placeholder="ex: 10h-18h" />
                                <div className="flex gap-3">
                                    <button onClick={() => setEditModal(null)} className="flex-1 glass py-4 rounded-2xl font-black text-slate-500">Fermer</button>
                                    <button onClick={() => saveException(editModal.ds, editModal.name, document.getElementById('shiftIn').value)} className="flex-1 bg-gradient-to-br from-purple-600 to-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl shadow-purple-500/30">Enregistrer</button>
                                </div>
                                {exceptions[editModal.ds] && exceptions[editModal.ds][editModal.name] && (
                                    <button onClick={() => resetException(editModal.ds, editModal.name)} className="w-full mt-5 text-red-500 font-black py-3 glass rounded-2xl border border-red-500/20">Réinitialiser l'horaire</button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
