        const getMonday = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = date.getUTCDay();
            const diff = date.getUTCDate() - day + (day === 0 ? -6 : 1);
            date.setUTCDate(diff);
            return date;
        };

        const getCycleIndex = (targetDate) => {
            const refDate = new Date(Date.UTC(2026, 2, 2)); 
            const targetMonday = getMonday(targetDate);
            const diffTime = targetMonday.getTime() - refDate.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            return ((diffWeeks % 6) + 6) % 6; 
        };

        const generateDateString = (dateObj) => {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        };

        const parseHours = (shiftStr) => {
            if (!shiftStr || shiftStr.toLowerCase().includes('repos') || shiftStr.toLowerCase().includes('cong')) return 0;
            const regex = /(\d{1,2})h(?:(\d{2}))?\s*(?:-|à)\s*(\d{1,2})h(?:(\d{2}))?/i;
            const match = shiftStr.match(regex);
            if(match) {
                const startH = parseInt(match[1]), startM = match[2] ? parseInt(match[2]) : 0;
                const endH = parseInt(match[3]), endM = match[4] ? parseInt(match[4]) : 0;
                return (endH + endM/60) - (startH + startM/60);
            }
            return 0;
        };

        const extractStartHour = (shiftStr) => {
            if (!shiftStr || shiftStr.toLowerCase().includes('repos') || shiftStr.toLowerCase().includes('cong')) return 99;
            const regex = /(\d{1,2})h(?:(\d{2}))?/i;
            const match = shiftStr.match(regex);
            if (match) return parseInt(match[1]) + (match[2] ? parseInt(match[2]) / 60 : 0);
            return 98;
        };

            const [newChatMessage, setNewChatMessage] = useState('');
            const [hasUnreadChat, setHasUnreadChat] = useState(false); 
            const [isEditingMessage, setIsEditingMessage] = useState(null);
            const [messageContextMenu, setMessageContextMenu] = useState(null);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('shiftsync_theme') === 'dark');
            const [exceptions, setExceptions] = useState({});
            const [employeePins, setEmployeePins] = useState({});
            const [toast, setToast] = useState(null);
            const [editModal, setEditModal] = useState(null);
            const messagesEndRef = useRef(null);
            const longPressTimer = useRef(null);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('shiftsync_theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            useEffect(() => {
                const unsubEx = db.collection('exceptions').onSnapshot(snap => {
                    const obj = {}; snap.forEach(doc => obj[doc.id] = doc.data());
                    setExceptions(obj);
                });
                const unsubPins = db.collection('settings').doc('pins').onSnapshot(doc => {
                    if (doc.exists) setEmployeePins(doc.data());
                });
                const unsubChat = db.collection('chat').orderBy('timestamp', 'desc').limit(50).onSnapshot(snap => {
                    setChatMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse());
                });
                return () => { unsubEx(); unsubPins(); unsubChat(); };
            }, []);

            useEffect(() => {
                if (activeTab === 'chat' && chatMessages.length > 0) {
                    setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                }
            }, [activeTab, chatMessages]);

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };
            const handleLogout = () => { setEmployee(null); localStorage.removeItem('shiftsync_profile'); };
            const handlePinSubmit = () => {
                if ((employeePins[loginModalUser] || '0000') === pinInput) {
                    setEmployee(loginModalUser); localStorage.setItem('shiftsync_profile', loginModalUser); setLoginModalUser(null);
                    showToast(`Bonjour ${loginModalUser} !`);
                } else { setPinError(true); setPinInput(''); }
            };

            const enableNotifications = async () => {
                if (!messaging) { showToast("Notifications non supportées."); return; }
                try {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        const token = await messaging.getToken();
                        if (token) {
                            await db.collection('users').doc(employee).set({ pushToken: token }, { merge: true });
                            showToast("Notifications activées !");
                        }
                    } else { showToast("Permission refusée."); }
                } catch (e) { showToast("Erreur d'activation."); console.error(e); }
            };

            const testNotification = () => {
                if (Notification.permission === 'granted') {
                    new Notification("ShiftSync", { body: "Test de notification opérationnel !", icon: ICON_URL });
                } else { showToast("Permission non accordée."); }
            };

            const submitActivePinChange = () => {
                if (activeNewPin.length !== 4 || activeNewPin !== activeConfirmPin) { setActivePinError('Codes invalides.'); return; }
                db.collection('settings').doc('pins').set({ [employee]: activeNewPin }, { merge: true }).then(() => { setIsChangingActivePin(false); showToast("PIN modifié !"); });
            };

            const getShiftForDate = (date, name) => {
                const ds = generateDateString(date);
                if (exceptions[ds] && exceptions[ds][name]) return exceptions[ds][name];
                const day = date.getDay();
                const nameDay = day === 0 ? 'dimanche' : DAYS_OF_WEEK[day - 1];
                return SCHEDULE_CYCLE[getCycleIndex(date)][name][nameDay] || 'repos';
            };

            const saveException = (ds, name, val) => {
                db.collection('exceptions').doc(ds).set({ [name]: val }, { merge: true }).then(() => { setEditModal(null); showToast("Enregistré"); });
            };

            const resetException = (ds, name) => {
                db.collection('exceptions').doc(ds).update({ [name]: firebase.firestore.FieldValue.delete() }).then(() => { setEditModal(null); showToast("Réinitialisé"); });
            };

            const handleSetVacation = (type) => {
                const s = new Date(vacationStart), e = new Date(vacationEnd);
                if (!vacationStart || !vacationEnd || e < s) { showToast("Dates invalides"); return; }
                const batch = db.batch();
                for (let l = new Date(s); l <= e; l.setDate(l.getDate() + 1)) {
                    const ds = generateDateString(l);
                    batch.set(db.collection('exceptions').doc(ds), { [employee]: type === 'add' ? "Congés 🌴" : firebase.firestore.FieldValue.delete() }, { merge: true });
                }
                batch.commit().then(() => { showToast("Calendrier mis à jour"); setVacationStart(''); setVacationEnd(''); });
            };

            const handleSendChat = async (e) => {
                e.preventDefault(); if (!newChatMessage.trim()) return;
                if (isEditingMessage) {
                    await db.collection('chat').doc(isEditingMessage).update({ text: newChatMessage.trim(), edited: true });
                    setIsEditingMessage(null);
                } else {

                    const dates = Object.keys(exceptions).filter(ds => exceptions[ds][name] === "Congés 🌴").sort();
                    if (dates.length === 0) return;
                    let start = new Date(dates[0]), prev = new Date(dates[0]);
                    for (let i = 1; i <= dates.length; i++) {
                        const current = i < dates.length ? new Date(dates[i]) : null;
                        const diff = current ? (current - prev) / 86400000 : null;
                        if (diff !== 1 || !current) {
                            periods.push({ employeeName: name, start: new Date(start), end: new Date(prev) });
                            if (current) start = new Date(current);
                        }
                        if (current) prev = new Date(current);
                    }
                });
                return periods.sort((a, b) => a.start - b.start);
            };

            const startPress = (msg) => { longPressTimer.current = setTimeout(() => { if (msg.sender === employee) setMessageContextMenu(msg); }, 500); };
            const stopPress = () => clearTimeout(longPressTimer.current);

            if (!employee) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 relative z-10">
                        <div className="glass rounded-[2.5rem] p-8 w-full max-w-md text-center">
                            <div className="glass-strong w-20 h-20 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 shadow-xl overflow-hidden">
                                <img src={ICON_URL} alt="Logo" className="w-full h-full object-cover" />
                            </div>
                            <h1 className="text-3xl font-black mb-6 tracking-tight">ShiftSync</h1>
                            <div className="space-y-3 overflow-y-auto max-h-[50vh]">
                                {EMPLOYEES.map(n => (
                                    <button key={n} onClick={() => { setLoginModalUser(n); setPinInput(''); setPinError(false); }} className="w-full glass-strong hover:bg-white/60 dark:hover:bg-slate-700/60 font-bold py-4 px-6 rounded-2xl flex justify-between items-center active:scale-95 transition-all">
                                        <span className="text-lg">{n}</span><IconChevronRight />
                                    </button>
                                ))}
                            </div>
                        </div>
                        {loginModalUser && (
                            <div className="fixed inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="glass-strong rounded-3xl w-full max-w-xs p-8 text-center animate-in zoom-in-95">
                                    <h3 className="text-2xl font-black mb-4">Code PIN</h3>
                                    <p className="text-sm mb-6 opacity-70">Identifiez-vous : <b>{loginModalUser}</b></p>
                                    <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full text-center text-3xl glass-input rounded-2xl p-4 font-black mb-4 focus:ring-4 focus:ring-purple-400 outline-none shadow-inner" placeholder="••••" />
                                    {pinError && <p className="text-red-500 text-xs font-bold mb-4">Code erroné</p>}
                                    <div className="flex gap-2">
                                        <button onClick={() => setLoginModalUser(null)} className="flex-1 glass py-3 rounded-xl font-bold">Annuler</button>
                                        <button onClick={handlePinSubmit} className="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold">Entrer</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const currentMonday = getMonday(currentViewDate);
            const todayStr = generateDateString(new Date());
            let totalW = 0;
            const weekDays = DAYS_OF_WEEK.map((d, i) => {
                const dt = new Date(currentMonday); dt.setDate(currentMonday.getDate() + i);
                const s = getShiftForDate(dt, employee);
                totalW += parseHours(s);
                return { d, dt, ds: generateDateString(dt), s };
            });

            return (
                <div className="min-h-screen flex flex-col relative z-10">
                    {toast && <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 glass-strong px-6 py-3 rounded-full shadow-xl font-bold border-2 border-purple-300/50">{toast}</div>}
                    
                    <header className="glass-strong rounded-b-[2.5rem] px-6 pb-5 pt-[calc(env(safe-area-inset-top)+1rem)] sticky top-0 z-40 shadow-lg border-b border-white/20">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl shadow-lg overflow-hidden flex items-center justify-center">
                                    <img src={ICON_URL} alt="Logo" className="w-full h-full object-cover" />
                                </div>
                                <h1 className="text-xl font-black truncate max-w-[140px] tracking-tight">{employee}</h1>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="glass-strong p-2.5 rounded-full">{isDarkMode ? '☀️' : '🌙'}</button>
                                <button onClick={() => setIsChangingActivePin(true)} className="glass-strong p-2.5 rounded-full text-purple-600"><IconKey /></button>
                                <button onClick={handleLogout} className="glass-strong p-2.5 rounded-full text-red-500"><IconLogOut /></button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-4 flex-1 w-full mt-6 pb-32">
                        {activeTab === 'me' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center px-2">
                                    <div className="glass-strong px-5 py-2.5 rounded-2xl font-black text-purple-700 dark:text-purple-300 border border-purple-200/50 shadow-sm">Total : {totalW.toFixed(1)}h</div>
                                </div>
                                {weekDays.map(({ d, dt, ds, s }) => (
                                    <div key={ds} className={`glass p-5 rounded-[1.5rem] border border-white/30 ${ds === todayStr ? 'ring-2 ring-purple-500 shadow-2xl' : ''}`}>
                                        <div className="flex justify-between items-center">
                                            <div><h3 className="capitalize font-black text-xl">{d}</h3><p className="opacity-50 text-sm font-bold">{dt.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })}</p></div>
                                            <div className="flex items-center gap-2">
                                                <div className={`px-4 py-2 rounded-xl font-black text-sm ${s.toLowerCase().includes('repos') ? 'opacity-30' : 'bg-purple-600 text-white shadow-md'}`}>{s}</div>
                                                <button onClick={() => setEditModal({ds, name: employee, curr: s})} className="p-2 opacity-30"><IconEdit /></button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'team' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black px-2 mt-2 tracking-tight">L'équipe aujourd'hui</h2>
                                <div className="space-y-3">
                                    {EMPLOYEES.sort((a,b) => extractStartHour(getShiftForDate(new Date(), a)) - extractStartHour(getShiftForDate(new Date(), b))).map(n => {
                                        const s = getShiftForDate(new Date(), n);
                                        const isRepos = s.toLowerCase().includes('repos') || s.toLowerCase().includes('cong');
                                        return (
                                            <div key={n} className={`glass p-4 rounded-[1.5rem] flex justify-between items-center border border-white/20 shadow-sm ${isRepos ? 'opacity-30' : ''}`}>
                                                <span className="font-black text-lg tracking-tight">{n}</span>
                                                <div className={`px-4 py-2 rounded-xl font-black text-sm ${isRepos ? 'bg-slate-200 text-slate-500' : 'bg-purple-100 text-purple-700'}`}>{s}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'chat' && (
                            <div className="flex flex-col h-[calc(100vh-11rem)] overflow-hidden">
                                <div className="flex-1 overflow-y-auto space-y-6 p-2 pb-32 scroll-smooth">
                                    {chatMessages.map(m => (
                                        <div key={m.id} onMouseDown={() => startPress(m)} onTouchStart={() => startPress(m)} onMouseUp={stopPress} onTouchEnd={stopPress}
                                             className={`flex flex-col ${m.sender === employee ? 'items-end' : 'items-start'} transition-transform active:scale-95 animate-in slide-in-from-bottom-2`}>
                                            <span className="text-[9px] font-black opacity-40 px-3 uppercase tracking-widest mb-1">{m.sender}</span>
                                            <div className={`max-w-[85%] rounded-[1.75rem] px-5 py-3.5 shadow-lg ${m.sender === employee ? 'bg-purple-600 text-white rounded-br-none shadow-purple-500/20' : 'glass-strong rounded-bl-none text-slate-800 dark:text-white'}`}>
                                                <p className="leading-relaxed break-words">{m.text} {m.edited && <span className="text-[10px] opacity-40 italic ml-1">(modifié)</span>}</p>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} className="h-40" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'vacances' && (
                            <div className="space-y-8 pb-20">
                                <div className="glass-strong p-8 rounded-[2.5rem] space-y-6 border border-white/30 shadow-lg">
                                    <h2 className="text-2xl font-black tracking-tight"><IconPlane className="inline mr-2" /> Mes Congés</h2>
                                    <div className="space-y-4">
                                        <input type="date" value={vacationStart} onChange={e => setVacationStart(e.target.value)} className="w-full glass-input rounded-2xl p-4 font-black" />
                                        <input type="date" value={vacationEnd} onChange={e => setVacationEnd(e.target.value)} className="w-full glass-input rounded-2xl p-4 font-black" />
                                        <button onClick={() => handleSetVacation('add')} className="w-full py-5 bg-purple-600 text-white rounded-2xl font-black">Enregistrer mes congés 🌴</button>
                                        <button onClick={() => handleSetVacation('remove')} className="w-full py-4 glass text-red-500 rounded-2xl font-black">Annuler la sélection</button>
                                    </div>
                                </div>
                                <div className="px-2">
                                    <h3 className="text-lg font-black mb-4 opacity-40 uppercase tracking-widest px-2">Planning Global</h3>
                                    <div className="space-y-3">
                                        {getAllVacationPeriods().map((p, idx) => (
                                            <div key={idx} className="glass p-5 rounded-[1.5rem] border border-white/20 flex items-center justify-between shadow-sm">
                                                <div><span className="font-black text-purple-600 uppercase text-[10px]">{p.employeeName}</span><p className="font-black text-sm">{p.start.toLocaleDateString('fr-FR', { day:'numeric', month:'short' })} au {p.end.toLocaleDateString('fr-FR', { day:'numeric', month:'short', year:'numeric' })}</p></div>
                                                <div className="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">🌴</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {activeTab === 'chat' && (
                        <div className="fixed bottom-[105px] left-4 right-4 z-40">
                             {isEditingMessage && (
                                <div className="bg-purple-600/10 backdrop-blur rounded-t-2xl px-5 py-2 text-[10px] font-black text-purple-700 flex justify-between border-t border-x border-white/20">
                                    <span>Modification du message...</span><button onClick={() => { setIsEditingMessage(null); setNewChatMessage(''); }}>Annuler</button>
                                </div>
                            )}
                            <form onSubmit={handleSendChat} className={`glass-strong ${isEditingMessage ? 'rounded-b-[2rem]' : 'rounded-[2.5rem]'} p-2.5 flex items-center gap-3 shadow-2xl border border-white/40`}>
                                <input type="text" value={newChatMessage} onChange={e => setNewChatMessage(e.target.value)} placeholder="Message..." className="flex-1 bg-transparent px-5 py-3 font-bold focus:outline-none" />
                                <button type="submit" disabled={!newChatMessage.trim()} className="p-4 bg-purple-600 text-white rounded-full shadow-lg active:scale-90 disabled:opacity-30">
                                    <IconSend />
                                </button>
                            </form>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 glass-strong pt-4 pb-6 px-6 flex justify-between shadow-2xl z-50 border-t border-white/30">
                        <div className="max-w-md mx-auto w-full flex justify-between">
                            <button onClick={() => setActiveTab('me')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'me' ? 'bg-purple-600/10 text-purple-700' : 'opacity-40'}`}><IconUser /><span className="text-[9px] font-black mt-1">MOI</span></button>
                            <button onClick={() => setActiveTab('team')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'team' ? 'bg-purple-600/10 text-purple-700' : 'opacity-40'}`}><IconUsers /><span className="text-[9px] font-black mt-1">ÉQUIPE</span></button>
                            <button onClick={() => setActiveTab('vacances')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'vacances' ? 'bg-purple-600/10 text-purple-700' : 'opacity-40'}`}><IconPlane /><span className="text-[9px] font-black mt-1">CONGÉS</span></button>
                            <button onClick={() => setActiveTab('chat')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl relative ${activeTab === 'chat' ? 'bg-purple-600/10 text-purple-700' : 'opacity-40'}`}>
                                <IconMessage />
                                {hasUnreadChat && <span className="absolute top-2 right-1/4 h-3 w-3 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>}
                                <span className="text-[9px] font-black mt-1">CHAT</span>
                            </button>
                        </div>
                    </nav>

                    {isChangingActivePin && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-lg z-[60] flex items-center justify-center p-4">
                            <div className="glass-strong rounded-[3rem] p-10 w-full max-w-xs text-center shadow-2xl border border-white/30 overflow-y-auto max-h-[90vh]">
                                <h3 className="font-black text-2xl mb-4">Réglages</h3>
                                <div className="space-y-4 mb-8">
                                    <button onClick={enableNotifications} className="w-full flex items-center justify-center gap-3 py-4 bg-purple-600 text-white rounded-2xl font-black shadow-lg">
                                        <IconBell /> Activer les Notifications
                                    </button>
                                    <button onClick={testNotification} className="w-full py-3 glass rounded-2xl font-black text-sm">Tester une notification</button>
                                    <hr className="opacity-10" />
                                    <input type="password" maxLength="4" value={activeNewPin} onChange={e => setActiveNewPin(e.target.value)} className="w-full glass-input rounded-2xl p-4 font-black text-center shadow-inner" placeholder="Nouveau PIN" />
                                    <input type="password" maxLength="4" value={activeConfirmPin} onChange={e => setActiveConfirmPin(e.target.value)} className="w-full glass-input rounded-2xl p-4 font-black text-center shadow-inner" placeholder="Confirmer" />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setIsChangingActivePin(false)} className="flex-1 glass py-4 rounded-2xl font-black text-slate-500">Retour</button>
                                    <button onClick={submitActivePinChange} className="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-black">Sauver</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editModal && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-lg z-[60] flex items-center justify-center p-4">
                            <div className="glass-strong rounded-[2.5rem] p-8 w-full max-w-sm border border-white/30 shadow-2xl text-center">
                                <h3 className="font-black text-2xl mb-4">Modifier Horaire</h3>
                                <p className="mb-6 opacity-40 font-bold text-sm">{new Date(editModal.ds).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'})}</p>
                                <input type="text" id="shiftIn" defaultValue={editModal.curr} className="w-full glass-input rounded-2xl p-5 font-black text-xl mb-8 outline-none text-center" placeholder="ex: 10h-18h" />
                                <div className="flex gap-3">
                                    <button onClick={() => setEditModal(null)} className="flex-1 glass py-4 rounded-2xl font-black text-slate-500">Fermer</button>
                                    <button onClick={() => saveException(editModal.ds, editModal.name, document.getElementById('shiftIn').value)} className="flex-1 bg-purple-600 text-white py-4 rounded-2xl font-black">Enregistrer</button>
                                </div>
                                {exceptions[editModal.ds] && exceptions[editModal.ds][editModal.name] && (
                                    <button onClick={() => resetException(editModal.ds, editModal.name)} className="w-full mt-5 text-red-500 font-black py-3 glass rounded-2xl border border-red-500/20">Réinitialiser l'horaire</button>
                                )}
                            </div>
                        </div>
                    )}

                    {messageContextMenu && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end justify-center p-0">
                            <div className="w-full max-w-sm glass-strong rounded-t-[2.5rem] p-8 menu-pop shadow-2xl border-t border-white/20">
                                <h3 className="text-center font-black text-xl mb-6 tracking-tight">Gérer mon message</h3>
                                <div className="space-y-4">
                                    <button onClick={() => { setIsEditingMessage(messageContextMenu.id); setNewChatMessage(messageContextMenu.text); setMessageContextMenu(null); }} className="w-full flex items-center justify-center gap-3 py-5 bg-purple-600 text-white rounded-2xl font-black shadow-lg">
                                        <IconEdit /> Modifier le message
                                    </button>
                                    <button onClick={() => { db.collection('chat').doc(messageContextMenu.id).delete(); setMessageContextMenu(null); showToast("Supprimé"); }} className="w-full flex items-center justify-center gap-3 py-5 bg-red-500 text-white rounded-2xl font-black shadow-lg">
                                        <IconTrash /> Supprimer définitivement
                                    </button>
                                    <button onClick={() => setMessageContextMenu(null)} className="w-full py-4 glass text-slate-500 rounded-2xl font-black">Annuler</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
