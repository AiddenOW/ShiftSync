        const getMonday = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));

            const diff = date.getUTCDate() - day + (day === 0 ? -6 : 1);
            date.setUTCDate(diff);
            return date;
        };

        const getCycleIndex = (targetDate) => {
            const refDate = new Date(Date.UTC(2026, 2, 2)); 
            const targetMonday = getMonday(targetDate);
            const diffTime = targetMonday.getTime() - refDate.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            return ((diffWeeks % 6) + 6) % 6; 
        };

        const parseHours = (shiftStr) => {
            if (!shiftStr || shiftStr.toLowerCase().includes('repos') || shiftStr.toLowerCase().includes('cong') || shiftStr.toLowerCase() === 'absent') return 0;
            const regex = /(\d{1,2})h(?:(\d{2}))?\s*(?:-|à)\s*(\d{1,2})h(?:(\d{2}))?/i;
            const match = shiftStr.match(regex);
            if(match) {
                const startH = parseInt(match[1]);
                const startM = match[2] ? parseInt(match[2]) : 0;
                const endH = parseInt(match[3]);
                const endM = match[4] ? parseInt(match[4]) : 0;
                let duration = (endH + endM/60) - (startH + startM/60);
                return duration > 0 ? duration : 0;
            }
            return 0;
        };

                    setEmployee(loginModalUser);

                    setLoginModalUser(null);
                    setIsChangingPin(false);
                    showToast(`Code PIN enregistré, bienvenue ${loginModalUser} !`);
                }).catch((error) => {
                    setChangePinError("Erreur lors de l'enregistrement.");
                    console.error("Firebase write error (pin):", error);
                });
            };

            const handleLogout = () => {
                setEmployee(null);
                localStorage.removeItem('shiftsync_profile');
            };

            const submitActivePinChange = () => {
                if (activeNewPin.length !== 4 || activeConfirmPin.length !== 4) {
                    setActivePinError('Le code doit faire 4 chiffres.');
                    return;
                }
                if (activeNewPin !== activeConfirmPin) {
                    setActivePinError('Les deux codes ne correspondent pas.');
                    setActiveNewPin('');
                    setActiveConfirmPin('');
                    return;
                }

                db.collection('settings').doc('pins').set({
                    [employee]: activeNewPin
                }, { merge: true }).then(() => {
                    setIsChangingActivePin(false);
                    showToast("Code PIN modifié avec succès ! 🔒");
                }).catch((error) => {
                    setActivePinError("Erreur lors de l'enregistrement.");
                    console.error("Firebase write error (pin):", error);
                });
            };

            const getShiftForDate = (dateObj, empName) => {
                const dateStr = generateDateString(dateObj);
                if (exceptions[dateStr] && exceptions[dateStr][empName]) {
                    return exceptions[dateStr][empName];
                }
                const day = dateObj.getDay();
                const dayName = day === 0 ? 'dimanche' : DAYS_OF_WEEK[day - 1];
                const cycle = getCycleIndex(dateObj);
                return SCHEDULE_CYCLE[cycle][empName][dayName] || 'repos';
            };

            const saveException = (dateStr, empName, newShift) => {
                // Enregistrement dans la base de données Firebase
                db.collection('exceptions').doc(dateStr).set({
                    [empName]: newShift
                }, { merge: true }).then(() => {
                    setEditModal(null);
                    showToast("Horaire synchronisé ! ☁️");
                }).catch((error) => {
                    showToast("Erreur de sauvegarde...");
                    console.error("Firebase write error:", error);
                });
            };

            const resetException = (dateStr, empName) => {
                // Suppression de la modification dans Firebase
                db.collection('exceptions').doc(dateStr).update({
                    [empName]: firebase.firestore.FieldValue.delete()
                }).then(() => {
                    setEditModal(null);
                    showToast("Horaire réinitialisé ! ☁️");
                }).catch((error) => {
                    // Si le document est déjà vide, on peut le supprimer totalement
                    if(error.code === 'not-found') {
                        setEditModal(null);
                    }
                });
            };

            const handleSetVacation = (type) => {
                if (!vacationStart || !vacationEnd) {
                    showToast("Sélectionnez les dates !"); return;
                }
                const start = new Date(vacationStart);
                const end = new Date(vacationEnd);
                if (end < start) {
                    showToast("Dates invalides !"); return;
                }

                const batch = db.batch();
                let loop = new Date(start);
                
                while (loop <= end) {
                    const dateStr = generateDateString(loop);
                    const docRef = db.collection('exceptions').doc(dateStr);
                    if (type === 'add') {
                        batch.set(docRef, { [employee]: "Congés 🌴" }, { merge: true });
                    } else {
                        // Utilisation de set + merge avec FieldValue.delete() pour éviter les erreurs not-found
                        batch.set(docRef, { [employee]: firebase.firestore.FieldValue.delete() }, { merge: true });
                    }
                    const newDate = loop.setDate(loop.getDate() + 1);
                    loop = new Date(newDate);
                }

                batch.commit().then(() => {
                    showToast(type === 'add' ? "Congés enregistrés ! 🌴" : "Congés annulés !");
                    setVacationStart('');
                    setVacationEnd('');
                }).catch(e => {
                    showToast("Erreur lors de la sauvegarde.");
                    console.error(e);
                });
            };

            const handleShare = (weekDates, totalHours) => {
                const mondayStr = weekDates[0].date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                let text = `🗓️ *Mon planning ShiftSync (Sem. du ${mondayStr})*\n\n`;
                weekDates.forEach(d => { text += `• ${d.dayName} : ${d.horaire}\n`; });
                text += `\n⏱️ Total estimé : ${totalHours}h`;

                if (navigator.share) {
                    navigator.share({ title: 'Mon Planning', text: text }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(text);
                    showToast("Planning copié dans le presse-papier !");
                }
            };

            if (!employee) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 safe-top safe-bottom">
                        <div className="bg-white dark:bg-darkcard rounded-3xl shadow-xl p-8 w-full max-w-md text-center border border-slate-100 dark:border-slate-800">
                            <div className="bg-gradient-to-br from-cyan-400 to-blue-600 text-white w-20 h-20 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/40">

                                        className="w-full bg-slate-50 dark:bg-slate-800/50 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 font-semibold py-3.5 px-5 rounded-2xl border-2 border-slate-100 dark:border-slate-700 hover:border-blue-200 dark:hover:border-blue-800 transition-all active:scale-95 flex justify-between items-center"
                                    >
                                        <div className="flex items-center gap-3"><IconUser /><span className="text-lg">{name}</span></div>
                                        <div className="text-slate-400 dark:text-slate-500"><IconChevronRight /></div>
                                    </button>
                                ))}
                            </div>
                        </div>

                                    <div className="mx-auto bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 w-12 h-12 rounded-full flex items-center justify-center mb-4">
                                        <IconUser />
                                    </div>
                                    
                                    {!isChangingPin ? (
                                        // VUE DE CONNEXION NORMALE
                                        <>
                                            <h3 className="text-xl font-bold mb-1 dark:text-white">Code secret</h3>
                                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                                                Identifiez-vous en tant que <strong>{loginModalUser}</strong>
                                                <br/>
                                                <span className="text-xs italic">(Code par défaut: 0000)</span>
                                            </p>
                                            
                                            <input 
                                                type="password" 
                                                pattern="[0-9]*"
                                                inputMode="numeric"
                                                maxLength="4"
                                                value={pinInput}

                                                placeholder="••••"
                                            />
                                            {pinError && <p className="text-red-500 text-xs font-bold mb-4 animate-bounce">Code incorrect</p>}
                                            {!pinError && <div className="h-4 mb-4"></div>}

                                            <div className="flex gap-3 mt-2">
                                                <button onClick={() => setLoginModalUser(null)} className="flex-1 py-3 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                                                    Annuler
                                                </button>
                                                <button onClick={handlePinSubmit} className="flex-1 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30">
                                                    Valider
                                                </button>
                                            </div>
                                        </>
                                    ) : (

                                        <>
                                            <h3 className="text-xl font-bold mb-1 dark:text-white">Nouveau code</h3>
                                            <p className="text-sm text-amber-600 dark:text-amber-500 font-medium mb-6">
                                                Première connexion ! Veuillez choisir un code PIN à 4 chiffres.

                                                    <input 
                                                        type="password" 
                                                        pattern="[0-9]*"
                                                        inputMode="numeric"
                                                        maxLength="4"

                                        </>

                                </div>
                            </div>

                                </div>

                                    {isDarkMode ? <IconSun /> : <IconMoon />}
                                </button>
                                <button onClick={() => { setIsChangingActivePin(true); setActiveNewPin(''); setActiveConfirmPin(''); setActivePinError(''); }} className="bg-white/20 p-2.5 rounded-full hover:bg-white/30 transition backdrop-blur-sm active:scale-90 text-blue-100 hover:text-white" title="Modifier mon code PIN">
                                    <IconKey />
                                </button>
                                <button onClick={handleLogout} className="bg-white/20 p-2.5 rounded-full hover:bg-white/30 transition backdrop-blur-sm active:scale-90 text-red-100 hover:text-white">
                                    <IconLogOut />
                                </button>
                            </div>
                        </div>

                    <main className="max-w-md mx-auto px-4 flex-1 w-full mt-6">
                        
                        {/* NAVIGATION TEMPORELLE */}
                        {activeTab !== 'vacances' && (

                                    <IconChevronLeft />
                                </button>

                                        Semaine du
                                    </span>
                                    <span className="font-bold text-slate-800 dark:text-white text-lg">
                                        {currentMonday.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}
                                    </span>
                                </button>
                                
                                <button onClick={() => setCurrentViewDate(new Date(currentViewDate.setDate(currentViewDate.getDate() + 7)))} className="p-3 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-slate-800 rounded-xl transition active:scale-90">
                                    <IconChevronRight />
                                </button>
                            </div>
                        )}

                        {/* ONGLET 1 : MON PLANNING */}
                        {activeTab === 'me' && (
                            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-2 duration-300">
                                <div className="flex justify-between items-center px-1 mb-2">
                                    <div className="text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-slate-800 px-3 py-1 rounded-lg">
                                        Total : {totalHoursThisWeek}h
                                    </div>
                                    <button onClick={() => handleShare(weekDates, totalHoursThisWeek)} className="text-blue-600 dark:text-blue-400 text-sm font-bold flex items-center gap-1.5 hover:bg-blue-50 dark:hover:bg-blue-900/30 px-3 py-1 rounded-lg transition">
                                        <IconShare /> Partager
                                    </button>
                                </div>

                                {weekDates.map(({ dayName, date, dateString, horaire }) => {
                                    const isToday = dateString === todayStr;
                                    const isOff = horaire.toLowerCase().includes('repos') || horaire.toLowerCase().includes('cong');
                                    const hasException = exceptions[dateString] && exceptions[dateString][employee];

                                                : isOff ? 'bg-slate-50 dark:bg-darkbg border-slate-200 dark:border-slate-800 opacity-80'

                        {/* ONGLET 3 : VACANCES */}

                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1 block">Au (inclus)</label>
                                            <input type="date" value={vacationEnd} onChange={e => setVacationEnd(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <button onClick={() => handleSetVacation('add')} className="w-full py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition">
                                            Enregistrer ces congés
                                        </button>
                                        <button onClick={() => handleSetVacation('remove')} className="w-full py-3 rounded-xl font-bold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 transition">
                                            Retirer les congés sur cette période
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* BOTTOM NAVIGATION */}
                    <div className="fixed bottom-0 left-0 right-0 bg-white dark:bg-darkcard border-t border-slate-200 dark:border-slate-800 pb-safe pt-2 px-6 pb-4 z-20">
                        <div className="max-w-md mx-auto flex justify-between px-2">
                            <button onClick={() => setActiveTab('me')} className={`flex flex-col items-center p-2 rounded-xl w-20 transition ${activeTab === 'me' ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                <IconUser />
                                <span className="text-[10px] font-bold mt-1 uppercase">Moi</span>
                            </button>
                            <button onClick={() => setActiveTab('team')} className={`flex flex-col items-center p-2 rounded-xl w-20 transition ${activeTab === 'team' ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                <IconUsers />
                                <span className="text-[10px] font-bold mt-1 uppercase">L'Équipe</span>
                            </button>
                            <button onClick={() => setActiveTab('vacances')} className={`flex flex-col items-center p-2 rounded-xl w-20 transition ${activeTab === 'vacances' ? 'text-blue-600 dark:text-blue-400' : 'text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                                <IconPlane />
                                <span className="text-[10px] font-bold mt-1 uppercase">Congés</span>
                            </button>
                        </div>
                    </div>

                    {/* MODAL EDITION */}
                    {editModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-darkcard rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-in zoom-in-95 duration-200">
                                <h3 className="text-xl font-bold mb-4 dark:text-white">Modifier l'horaire</h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">
                                    Date : <strong className="text-slate-800 dark:text-slate-200">{new Date(editModal.dateString).toLocaleDateString('fr-FR', {weekday: 'long', day:'numeric', month:'long'})}</strong><br/>
                                    Profil : <strong className="text-slate-800 dark:text-slate-200">{editModal.empName}</strong>
                                </p>
                                
                                <input 
                                    type="text" 
                                    id="shiftInput"
                                    defaultValue={editModal.currentShift}
                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-4 font-bold text-slate-800 dark:text-white mb-6 focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="ex: 9h30 - 17h ou repos"
                                />

                                <div className="flex gap-3">
                                    <button onClick={() => setEditModal(null)} className="flex-1 py-3 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                                        Annuler
                                    </button>
                                    <button onClick={() => saveException(editModal.dateString, editModal.empName, document.getElementById('shiftInput').value)} className="flex-1 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30">
                                        Enregistrer
                                    </button>
                                </div>
                                {exceptions[editModal.dateString] && exceptions[editModal.dateString][editModal.empName] && (
                                    <button onClick={() => resetException(editModal.dateString, editModal.empName)} className="w-full mt-4 py-2 text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg">
                                        Rétablir l'horaire normal
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL CHANGEMENT DE PIN VOLONTAIRE */}
                    {isChangingActivePin && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-darkcard rounded-3xl w-full max-w-xs p-6 shadow-2xl animate-in zoom-in-95 duration-200 text-center border border-slate-100 dark:border-slate-700">
                                <div className="mx-auto bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 w-12 h-12 rounded-full flex items-center justify-center mb-4">
                                    <IconKey />
                                </div>
                                <h3 className="text-xl font-bold mb-1 dark:text-white">Modifier mon PIN</h3>
                                <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                                    Choisissez un nouveau code à 4 chiffres.
                                </p>
                                
                                <div className="space-y-3 mb-4">
                                    <div>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase block text-left mb-1">Nouveau code</label>
                                        <input 
                                            type="password" 
                                            pattern="[0-9]*"
                                            inputMode="numeric"
                                            maxLength="4"
                                            value={activeNewPin}
                                            onChange={(e) => { setActiveNewPin(e.target.value); setActivePinError(''); }}
                                            className="w-full text-center text-2xl tracking-[0.3em] bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                            placeholder="••••"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase block text-left mb-1">Confirmer</label>
                                        <input 
                                            type="password" 
                                            pattern="[0-9]*"
                                            inputMode="numeric"
                                            maxLength="4"
                                            value={activeConfirmPin}
                                            onChange={(e) => { setActiveConfirmPin(e.target.value); setActivePinError(''); }}
                                            className="w-full text-center text-2xl tracking-[0.3em] bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 font-bold text-slate-800 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"
                                            placeholder="••••"
                                        />
                                    </div>
                                </div>

                                {activePinError && <p className="text-red-500 text-xs font-bold mb-4 animate-pulse">{activePinError}</p>}
                                {!activePinError && <div className="h-4 mb-4"></div>}

                                <div className="flex gap-3 mt-2">
                                    <button onClick={() => setIsChangingActivePin(false)} className="flex-1 py-3 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">
                                        Annuler
                                    </button>
                                    <button onClick={submitActivePinChange} className="flex-1 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30">
                                        Enregistrer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
