<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ShiftSync</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShiftSync">
    
    <!-- Icône mise à jour pour le nouveau nom "ShiftSync" (Un "S" blanc sur fond bleu) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%232563EB'/%3E%3Ctext x='50%25' y='50%25' font-family='system-ui, sans-serif' font-weight='bold' font-size='320' fill='white' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%232563EB'/%3E%3Ctext x='50%25' y='50%25' font-family='system-ui, sans-serif' font-weight='bold' font-size='320' fill='white' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E">

    <link id="manifest-link" rel="manifest" href="">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const manifest = {
            name: "ShiftSync",
            short_name: "ShiftSync",
            display: "standalone",
            background_color: "#f8fafc",
            theme_color: "#2563EB",
            icons: [{
                src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%232563EB'/%3E%3Ctext x='50%25' y='50%25' font-family='system-ui, sans-serif' font-weight='bold' font-size='320' fill='white' text-anchor='middle' dominant-baseline='central'%3ES%3C/text%3E%3C/svg%3E",
                sizes: "512x512",
                type: "image/svg+xml",
                purpose: "any maskable"
            }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(blob);
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
        const IconChevronRightLarge = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const IconCalendar = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconLogOut = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconCoffee = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>;

        // Remplacement de Théo par Stéphanie dans les données
        const SCHEDULE_CYCLE = [
            { // Semaine 1
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30" }
            },
            { // Semaine 2
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h" }
            },
            { // Semaine 3
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30" }
            }
        ];

        const DAYS_OF_WEEK = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

        const getMonday = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = date.getUTCDay();
            const diff = date.getUTCDate() - day + (day === 0 ? -6 : 1);
            date.setUTCDate(diff);
            return date;
        };

        const getCycleIndex = (targetDate) => {
            const refDate = new Date(Date.UTC(2026, 2, 2)); 
            const targetMonday = getMonday(targetDate);
            const diffTime = targetMonday.getTime() - refDate.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            
            return ((diffWeeks % 3) + 3) % 3;
        };

        const generateDateString = (dateObj) => {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        };

        function App() {
            // Mise à jour de la clé du localStorage
            const [employee, setEmployee] = useState(localStorage.getItem('shiftsync_profile') || null);
            const [currentViewDate, setCurrentViewDate] = useState(new Date());

            const handleSetEmployee = (name) => {
                setEmployee(name);
                if (name) {
                    localStorage.setItem('shiftsync_profile', name);
                } else {
                    localStorage.removeItem('shiftsync_profile');
                }
            };

            const today = new Date();
            const todayStr = generateDateString(today);

            if (!employee) {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-6 font-sans safe-top safe-bottom">
                        <div className="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md text-center">
                            <div className="bg-blue-600 text-white w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-200">
                                <span className="text-4xl font-bold">S</span>
                            </div>
                            <h1 className="text-3xl font-bold text-slate-800 mb-2">ShiftSync</h1>
                            <p className="text-slate-500 mb-8">Sélectionnez votre profil pour commencer</p>
                            
                            <div className="space-y-4">
                                {/* Remplacement de Théo par Stéphanie dans les boutons */}
                                {['Tom', 'Anthony', 'Stéphanie'].map((name) => (
                                    <button
                                        key={name}
                                        onClick={() => handleSetEmployee(name)}
                                        className="w-full bg-slate-50 hover:bg-blue-50 text-slate-700 hover:text-blue-700 font-semibold py-4 px-6 rounded-2xl border-2 border-slate-100 hover:border-blue-200 transition-all active:scale-95 flex justify-between items-center"
                                    >
                                        <div className="flex items-center gap-3">
                                            <IconUser />
                                            <span className="text-lg">{name}</span>
                                        </div>
                                        <div className="text-slate-400">
                                            <IconChevronRight />
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            const currentMonday = getMonday(currentViewDate);
            const cycleIndex = getCycleIndex(currentViewDate);
            const weekSchedule = SCHEDULE_CYCLE[cycleIndex][employee];

            const prevWeek = () => {
                const newDate = new Date(currentViewDate);
                newDate.setDate(currentViewDate.getDate() - 7);
                setCurrentViewDate(newDate);
            };

            const nextWeek = () => {
                const newDate = new Date(currentViewDate);
                newDate.setDate(currentViewDate.getDate() + 7);
                setCurrentViewDate(newDate);
            };

            const goToToday = () => {
                setCurrentViewDate(new Date());
            };

            const weekDates = DAYS_OF_WEEK.map((dayName, index) => {
                const date = new Date(currentMonday);
                date.setDate(currentMonday.getDate() + index);
                return {
                    dayName,
                    date,
                    dateString: generateDateString(date),
                    horaire: weekSchedule[dayName]
                };
            });

            return (
                <div className="min-h-screen bg-slate-100 font-sans pb-10 safe-bottom">
                    <header className="bg-blue-600 text-white shadow-md rounded-b-3xl px-6 pb-6 pt-12 safe-top mb-6">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-white/20 w-12 h-12 rounded-xl flex items-center justify-center backdrop-blur-sm shadow-inner">
                                    <span className="text-2xl font-bold">S</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold tracking-tight">{employee}</h1>
                                    <p className="text-blue-200 text-sm mt-1 flex items-center gap-1">
                                        <IconCalendar />
                                        Cycle: Semaine {cycleIndex + 1}
                                    </p>
                                </div>
                            </div>
                            <button 
                                onClick={() => handleSetEmployee(null)}
                                className="bg-white/20 p-3 rounded-full hover:bg-white/30 transition backdrop-blur-sm active:scale-90"
                            >
                                <IconLogOut />
                            </button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-4">
                        <div className="bg-white rounded-2xl shadow-sm p-2 mb-6 flex justify-between items-center">
                            <button onClick={prevWeek} className="p-3 text-slate-400 hover:text-blue-600 hover:bg-blue-50 active:bg-blue-100 rounded-xl transition">
                                <IconChevronLeft />
                            </button>
                            
                            <button onClick={goToToday} className="flex flex-col items-center px-4 py-1 active:bg-slate-100 rounded-xl transition">
                                <span className="text-xs font-semibold uppercase text-slate-400 tracking-wider">Semaine du</span>
                                <span className="font-bold text-slate-800 text-lg">
                                    {currentMonday.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}
                                </span>
                            </button>
                            
                            <button onClick={nextWeek} className="p-3 text-slate-400 hover:text-blue-600 hover:bg-blue-50 active:bg-blue-100 rounded-xl transition">
                                <IconChevronRightLarge />
                            </button>
                        </div>

                        <div className="space-y-4">
                            {weekDates.map(({ dayName, date, dateString, horaire }) => {
                                const isToday = dateString === todayStr;
                                const isRepos = horaire.toLowerCase() === 'repos';

                                return (
                                    <div 
                                        key={dayName}
                                        className={`relative overflow-hidden rounded-2xl p-5 border ${
                                            isToday 
                                                ? 'bg-blue-50 border-blue-200 shadow-md ring-2 ring-blue-500 ring-opacity-50' 
                                                : isRepos 
                                                    ? 'bg-slate-50 border-slate-200 opacity-70'
                                                    : 'bg-white border-slate-100 shadow-sm'
                                        } transition-all`}
                                    >
                                        {isToday && (
                                            <div className="absolute top-0 right-0 bg-blue-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl shadow-sm">
                                                AUJOURD'HUI
                                            </div>
                                        )}

                                        <div className="flex items-center justify-between">
                                            <div>
                                                <h3 className={`capitalize font-bold text-lg ${isToday ? 'text-blue-800' : 'text-slate-800'}`}>
                                                    {dayName}
                                                </h3>
                                                <p className="text-slate-500 text-sm">
                                                    {date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' })}
                                                </p>
                                            </div>

                                            <div className={`flex items-center gap-2 px-4 py-2 rounded-xl font-bold shadow-sm ${
                                                isRepos 
                                                    ? 'bg-slate-200 text-slate-600' 
                                                    : isToday
                                                        ? 'bg-blue-600 text-white shadow-blue-200'
                                                        : 'bg-amber-100 text-amber-800'
                                            }`}>
                                                {isRepos ? <IconCoffee /> : <IconClock />}
                                                {horaire}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
