    <style>
        * { box-sizing: border-box !important; -webkit-tap-highlight-color: transparent; }
        body {
            -webkit-user-select: none; user-select: none;
            margin: 0; padding: 0; overflow-x: hidden;
            background-color: #0a0f1c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
        }
        .bg-gradient {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: radial-gradient(circle at top right, #1e1b4b, #0a0f1c);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
        }
        ::-webkit-scrollbar { display: none; }
        .menu-pop { animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }

<body>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHfCS2EnbmDHtWe_oVzdy0xDfnq1YNqtY",

            projectId: "shiftsync-5ebda",

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IconUser = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        const IconUsers = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const IconLogOut = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
        const IconMessage = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
        const IconSend = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
        const IconEdit = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconTrash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconPlane = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 3.3c-.2.5.1 1 .6 1.1l7.3 1.9-4.7 4.7-2.6-.4c-.4-.1-.8.1-1 .5l-1.1 1.6c-.2.4.1.9.5 1l3.7 1 1 3.7c.1.4.6.7 1 .5l1.6-1.1c.4-.2.6-.6.5-1l-.4-2.6 4.7-4.7 1.9 7.3c.1.5.6.8 1.1.6l3.3-1.2c.5-.2.8-.6.7-1.1z"></path></svg>;

        const EMPLOYEES = ['Tom', 'Anthony', 'Stéphanie', 'Raphaël', 'Max', 'Jérôme', 'Nicolas', 'Jean-Benoît'];
        const DAYS_OF_WEEK = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

        // Raphaël Samedi corrigé à 10h00 - 17h30
        const CYCLE_2_WEEKS = [
            {
                Raphaël: { lundi: "8h - 15h30", mardi: "8h30 - 16h", mercredi: "12h30 - 20h", jeudi: "repos", vendredi: "13h - 20h30", samedi: "10h00 - 17h30", dimanche: "repos" },
                Max: { lundi: "13h - 20h30", mardi: "repos", mercredi: "8h - 15h30", jeudi: "13h - 20h30", vendredi: "8h30 - 16h", samedi: "13h - 20h30", dimanche: "repos" },
                Jérôme: { lundi: "8h30 - 16h", mardi: "12h30 - 20h", mercredi: "10h30 - 19h", jeudi: "8h30 - 16h", vendredi: "repos", samedi: "8h30 - 16h", dimanche: "repos" },
                Nicolas: { lundi: "12h30 - 20h", mardi: "8h - 15h30", mercredi: "repos", jeudi: "8h - 15h30", vendredi: "12h30 - 20h", samedi: "12h30 - 20h", dimanche: "repos" },
                "Jean-Benoît": { lundi: "repos", mardi: "13h - 20h30", mercredi: "8h30 - 16h", jeudi: "12h30 - 20h", vendredi: "8h - 15h30", samedi: "8h - 15h30", dimanche: "repos" }
            },
            {
                Raphaël: { lundi: "8h - 15h30", mardi: "8h30 - 16h", mercredi: "12h30 - 20h", jeudi: "repos", vendredi: "13h - 20h30", samedi: "10h00 - 17h30", dimanche: "repos" },
                Max: { lundi: "13h - 20h30", mardi: "repos", mercredi: "8h - 15h30", jeudi: "13h - 20h30", vendredi: "8h30 - 16h", samedi: "8h - 15h30", dimanche: "repos" },
                Jérôme: { lundi: "8h30 - 16h", mardi: "12h30 - 20h", mercredi: "10h30 - 19h", jeudi: "8h30 - 16h", vendredi: "repos", samedi: "13h - 20h30", dimanche: "repos" },
                Nicolas: { lundi: "12h30 - 20h", mardi: "8h - 15h30", mercredi: "repos", jeudi: "8h - 15h30", vendredi: "12h30 - 20h", samedi: "8h30 - 16h", dimanche: "repos" },
                "Jean-Benoît": { lundi: "repos", mardi: "13h - 20h30", mercredi: "8h30 - 16h", jeudi: "12h30 - 20h", vendredi: "8h - 15h30", samedi: "12h30 - 20h", dimanche: "repos" }
            }
        ];

        const CYCLE_3_WEEKS = [
            {
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h", dimanche: "repos" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30", dimanche: "repos" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30", dimanche: "repos" }
            },
            {
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30", dimanche: "repos" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30", dimanche: "repos" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h", dimanche: "repos" }
            },
            {
                Tom: { lundi: "repos", mardi: "12h - 19h30", mercredi: "9h30 - 17h", jeudi: "9h30 - 17h", vendredi: "11h - 18h30", samedi: "12h - 19h30", dimanche: "repos" },
                Anthony: { lundi: "9h30 - 17h", mardi: "repos", mercredi: "12h - 19h30", jeudi: "11h - 18h30", vendredi: "12h - 19h30", samedi: "9h30 - 17h", dimanche: "repos" },
                Stéphanie: { lundi: "12h - 19h30", mardi: "9h30 - 17h", mercredi: "repos", jeudi: "12h - 19h30", vendredi: "9h30 - 17h", samedi: "11h - 18h30", dimanche: "repos" }
            }
        ];

        const SCHEDULE_CYCLE = [
            { ...CYCLE_3_WEEKS[0], ...CYCLE_2_WEEKS[0] },
            { ...CYCLE_3_WEEKS[1], ...CYCLE_2_WEEKS[1] },
            { ...CYCLE_3_WEEKS[2], ...CYCLE_2_WEEKS[0] },
            { ...CYCLE_3_WEEKS[0], ...CYCLE_2_WEEKS[1] },
            { ...CYCLE_3_WEEKS[1], ...CYCLE_2_WEEKS[0] },
            { ...CYCLE_3_WEEKS[2], ...CYCLE_2_WEEKS[1] },
        ];

        const getMonday = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = date.getUTCDay();
            const diff = date.getUTCDate() - day + (day === 0 ? -6 : 1);
            date.setUTCDate(diff);
            return date;
        };

        const getCycleIndex = (targetDate) => {
            const refDate = new Date(Date.UTC(2026, 2, 2)); 
            const targetMonday = getMonday(targetDate);
            const diffWeeks = Math.floor(Math.round((targetMonday.getTime() - refDate.getTime()) / 86400000) / 7);
            return ((diffWeeks % 6) + 6) % 6; 
        };

        const generateDateString = (dateObj) => {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        };

        const extractStartHour = (shiftStr) => {
            if (!shiftStr || shiftStr.toLowerCase().includes('repos') || shiftStr.toLowerCase().includes('cong')) return 99;
            const match = shiftStr.match(/(\d{1,2})h(?:(\d{2}))?/i);
            return match ? parseInt(match[1]) + (match[2] ? parseInt(match[2])/60 : 0) : 98;
        };

        function App() {
            const [employee, setEmployee] = useState(localStorage.getItem('shiftsync_profile') || null);
            const [activeTab, setActiveTab] = useState('me');
            const [loginModalUser, setLoginModalUser] = useState(null);
            const [pinInput, setPinInput] = useState('');
            const [chatMessages, setChatMessages] = useState([]);
            const [newChatMessage, setNewChatMessage] = useState('');
            const [isEditingMessage, setIsEditingMessage] = useState(null);
            const [messageContextMenu, setMessageContextMenu] = useState(null);
            const longPressTimer = useRef(null);
            const [exceptions, setExceptions] = useState({});
            const [employeePins, setEmployeePins] = useState({});
            const messagesEndRef = useRef(null);

            useEffect(() => {
                if (activeTab === 'chat' && chatMessages.length > 0) {
                    const t = setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                    return () => clearTimeout(t);
                }
            }, [activeTab, chatMessages]);

            useEffect(() => {
                const unsubEx = db.collection('exceptions').onSnapshot(snap => {
                    const obj = {}; snap.forEach(doc => obj[doc.id] = doc.data());
                    setExceptions(obj);
                });
                const unsubPins = db.collection('settings').doc('pins').onSnapshot(doc => { if (doc.exists) setEmployeePins(doc.data()); });
                const unsubChat = db.collection('chat').orderBy('timestamp', 'desc').limit(50).onSnapshot(snap => {
                    setChatMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse());
                });
                return () => { unsubEx(); unsubPins(); unsubChat(); };
            }, []);

            const handlePinSubmit = () => {
                if ((employeePins[loginModalUser] || '0000') === pinInput) {
                    setEmployee(loginModalUser); localStorage.setItem('shiftsync_profile', loginModalUser); setLoginModalUser(null);
                } else { setPinInput(''); }
            };

            const getShiftForDate = (date, name) => {
                const ds = generateDateString(date);
                if (exceptions[ds]?.[name]) return exceptions[ds][name];
                const day = date.getDay();
                const nameDay = day === 0 ? 'dimanche' : DAYS_OF_WEEK[day - 1];
                return SCHEDULE_CYCLE[getCycleIndex(date)][name][nameDay] || 'repos';
            };

            const handleSendChat = async (e) => {
                e.preventDefault(); if (!newChatMessage.trim()) return;
                if (isEditingMessage) {
                    await db.collection('chat').doc(isEditingMessage).update({ text: newChatMessage.trim(), edited: true });
                    setIsEditingMessage(null);
                } else {
                    await db.collection('chat').add({ text: newChatMessage.trim(), sender: employee, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                }
                setNewChatMessage('');
            };

            const startPress = (msg) => { longPressTimer.current = setTimeout(() => { if (msg.sender === employee) setMessageContextMenu(msg); }, 600); };
            const stopPress = () => clearTimeout(longPressTimer.current);

            if (!employee) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="glass-card rounded-[2.5rem] p-8 w-full max-w-md text-center shadow-2xl">
                            <div className="w-20 h-20 bg-indigo-600 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 text-white text-4xl font-black">S</div>
                            <h1 className="text-3xl font-black mb-6">ShiftSync</h1>
                            <div className="space-y-3 max-h-[50vh] overflow-y-auto">
                                {EMPLOYEES.map(n => (
                                    <button key={n} onClick={() => { setLoginModalUser(n); setPinInput(''); }} className="w-full bg-slate-800/80 py-4 px-6 rounded-2xl flex justify-between font-bold active:scale-95 transition-all">
                                        <span>{n}</span><IconUser />
                                    </button>
                                ))}
                            </div>
                        </div>
                        {loginModalUser && (
                            <div className="fixed inset-0 bg-black/50 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="glass-card rounded-3xl w-full max-w-xs p-8 text-center animate-in zoom-in-95">
                                    <h3 className="text-2xl font-black mb-6">PIN : {loginModalUser}</h3>
                                    <input type="password" pattern="[0-9]*" inputMode="numeric" maxLength="4" value={pinInput} onChange={e => setPinInput(e.target.value)} className="w-full text-center text-3xl glass-input rounded-2xl p-4 font-black mb-6 outline-none" placeholder="••••" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setLoginModalUser(null)} className="flex-1 bg-slate-700 py-3 rounded-xl font-bold">Retour</button>
                                        <button onClick={handlePinSubmit} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">OK</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const currentMonday = getMonday(new Date());

            return (
                <div className="min-h-screen flex flex-col relative pb-24">
                    <header className="glass-card rounded-b-[2.5rem] px-6 pb-5 pt-12 sticky top-0 z-40 shadow-lg border-b border-white/10">
                        <div className="max-w-md mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3"><div className="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black">S</div><h1 className="text-xl font-black">{employee}</h1></div>
                            <button onClick={handleLogout} className="bg-slate-800 p-2.5 rounded-full text-red-500"><IconLogOut /></button>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-4 flex-1 w-full mt-6">
                        {activeTab === 'me' && (
                            <div className="space-y-4">
                                {DAYS_OF_WEEK.map((d, i) => {
                                    const dt = new Date(currentMonday); dt.setDate(currentMonday.getDate() + i);
                                    const s = getShiftForDate(dt, employee);
                                    const isToday = generateDateString(dt) === generateDateString(new Date());
                                    return (
                                        <div key={d} className={`glass-card p-5 rounded-[1.5rem] border ${isToday ? 'border-indigo-500 shadow-indigo-500/20' : 'border-white/5'}`}>
                                            <div className="flex justify-between items-center">
                                                <div><h3 className="capitalize font-black text-xl">{d}</h3><p className="opacity-50 text-sm font-bold">{dt.toLocaleDateString('fr-FR', { day:'numeric', month:'long' })}</p></div>
                                                <div className="px-4 py-2 rounded-xl font-black text-sm bg-indigo-600 text-white">{s}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'team' && (
                            <div className="space-y-4">
                                <h2 className="text-2xl font-black px-2 mb-2">L'équipe du jour</h2>
                                {[...EMPLOYEES].sort((a,b) => extractStartHour(getShiftForDate(new Date(), a)) - extractStartHour(getShiftForDate(new Date(), b))).map(n => (
                                    <div key={n} className="glass-card p-4 rounded-[1.5rem] flex justify-between items-center border border-white/5 shadow-sm">
                                        <div className="flex items-center gap-4"><div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-black text-indigo-400">{n.charAt(0)}</div><span className="font-black">{n}</span></div>
                                        <div className="px-4 py-2 rounded-xl font-black text-sm bg-slate-800/50 text-indigo-300">{getShiftForDate(new Date(), n)}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'chat' && (
                            <div className="flex flex-col h-[calc(100vh-22rem)]">
                                <div className="flex-1 overflow-y-auto space-y-6 p-2 pt-4 scroll-smooth">
                                    {chatMessages.map(m => (
                                        <div key={m.id} onMouseDown={() => startPress(m)} onTouchStart={() => startPress(m)} onMouseUp={stopPress} onTouchEnd={stopPress}
                                             className={`flex flex-col ${m.sender === employee ? 'items-end' : 'items-start'} transition-transform active:scale-95 animate-in slide-in-from-bottom-2`}>
                                            <span className="text-[9px] font-black opacity-40 px-3 uppercase tracking-widest mb-1">{m.sender}</span>
                                            <div className={`max-w-[85%] rounded-[1.75rem] px-5 py-3.5 shadow-lg border ${m.sender === employee ? 'bg-indigo-600 text-white rounded-br-none border-indigo-500' : 'bg-slate-800 rounded-bl-none border-white/10'}`}>
                                                <p className="leading-relaxed">{m.text} {m.edited && <span className="text-[10px] opacity-40 italic ml-1">(modifié)</span>}</p>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} className="h-4" />
                                </div>
                            </div>
                        )}

                        {activeTab === 'vacances' && (
                            <div className="space-y-6">
                                <div className="glass-card p-8 rounded-[2rem] space-y-6 border border-white/5">
                                    <h2 className="text-2xl font-black flex items-center gap-3"><IconPlane /> Mes Congés</h2>
                                    <div className="space-y-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] uppercase font-black opacity-40 ml-2">Début</label>
                                            <input type="date" className="w-full glass-input rounded-xl p-4 font-black" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] uppercase font-black opacity-40 ml-2">Fin</label>
                                            <input type="date" className="w-full glass-input rounded-xl p-4 font-black" />
                                        </div>
                                        <button className="w-full py-5 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-500/20 active:scale-95 transition-all">Enregistrer mes congés 🌴</button>
                                        <button className="w-full py-4 glass-card text-red-500 rounded-2xl font-black active:scale-95 transition-all">Annuler</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {activeTab === 'chat' && (
                        <div className="fixed bottom-[110px] left-4 right-4 z-40">
                            {isEditingMessage && (
                                <div className="bg-indigo-900/60 backdrop-blur-md rounded-t-2xl px-5 py-2 text-[10px] font-black text-indigo-300 flex justify-between items-center border-t border-x border-white/10">
                                    <span>Modification du message...</span><button onClick={() => { setIsEditingMessage(null); setNewChatMessage(''); }}>Annuler</button>
                                </div>
                            )}
                            <form onSubmit={handleSendChat} className={`glass-card ${isEditingMessage ? 'rounded-b-[2rem]' : 'rounded-[2.5rem]'} p-2.5 flex items-center gap-3 shadow-2xl border-white/10`}>
                                <input type="text" value={newChatMessage} onChange={e => setNewChatMessage(e.target.value)} placeholder="Message..." className="flex-1 bg-transparent px-5 py-3 font-bold focus:outline-none placeholder:opacity-30" />
                                <button type="submit" disabled={!newChatMessage.trim()} className={`p-4 ${isEditingMessage ? 'bg-amber-500' : 'bg-indigo-600'} text-white rounded-full transition-all active:scale-90 disabled:opacity-30`}>
                                    {isEditingMessage ? <IconEdit /> : <IconSend />}
                                </button>
                            </form>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 glass-card pt-4 pb-4 px-6 flex justify-between shadow-2xl z-50 border-t border-white/10 safe-pb">
                        <div className="max-w-md mx-auto w-full flex justify-between gap-1">
                            <button onClick={() => setActiveTab('me')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'me' ? 'text-indigo-400 bg-indigo-500/10' : 'opacity-40'}`}><IconUser /><span className="text-[9px] font-black mt-1">MOI</span></button>
                            <button onClick={() => setActiveTab('team')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'team' ? 'text-indigo-400 bg-indigo-500/10' : 'opacity-40'}`}><IconUsers /><span className="text-[9px] font-black mt-1">ÉQUIPE</span></button>
                            <button onClick={() => setActiveTab('vacances')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'vacances' ? 'text-indigo-400 bg-indigo-500/10' : 'opacity-40'}`}><IconPlane /><span className="text-[9px] font-black mt-1">CONGÉS</span></button>
                            <button onClick={() => setActiveTab('chat')} className={`flex-1 flex flex-col items-center py-3 rounded-2xl ${activeTab === 'chat' ? 'text-indigo-400 bg-indigo-500/10' : 'opacity-40'}`}><IconMessage /><span className="text-[9px] font-black mt-1">CHAT</span></button>
                        </div>
                    </nav>

                    {messageContextMenu && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[70] flex items-end justify-center p-0">
                            <div className="w-full max-w-sm glass-card rounded-t-[2.5rem] p-8 menu-pop shadow-2xl border-t border-white/10">
                                <h3 className="text-center font-black text-xl mb-6 tracking-tight">Mon message</h3>
                                <div className="space-y-4">
                                    <button onClick={() => { setIsEditingMessage(messageContextMenu.id); setNewChatMessage(messageContextMenu.text); setMessageContextMenu(null); }} className="w-full flex items-center justify-center gap-3 py-5 bg-indigo-600 text-white rounded-2xl font-black active:scale-95 transition-all"><IconEdit /> Modifier le message</button>
                                    <button onClick={() => { db.collection('chat').doc(messageContextMenu.id).delete(); setMessageContextMenu(null); }} className="w-full flex items-center justify-center gap-3 py-5 bg-red-500 text-white rounded-2xl font-black active:scale-95 transition-all"><IconTrash /> Supprimer</button>
                                    <button onClick={() => setMessageContextMenu(null)} className="w-full py-4 bg-slate-800 text-slate-400 rounded-2xl font-black">Annuler</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
